version: '3.8'

services:
  backend:
    build: ./backend
    container_name: demo-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/users.db:/app/users.db

  frontend:
    build: ./frontend
    container_name: demo-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
